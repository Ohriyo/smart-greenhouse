; Smart Greenhouse firmware — ESP32 DevKit (30-pin), Arduino framework.
; Build:  pio run            Flash:  pio run -t upload        Serial:  pio device monitor
; Bring-up tests (one sensor/output each, no Wi-Fi):
;   pio run -e test_dht -t upload -t monitor      (also test_soil, test_bh1750, test_fan)
; Flash the main firmware again afterwards with: pio run -t upload
; See docs/firmware.md.

[platformio]
default_envs = esp32dev

[env:esp32dev]
; Versions are pinned so a build today and a build in a year use the same code.
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
; The bring-up test sketches live in src/bringup/ and are built only by their own envs.
build_src_filter = +<*> -<bringup/>

; This laptop also has several Bluetooth serial ports (COM3–COM8); pin the
; ESP32's CP2102 port so upload/monitor never pick the wrong one.
; Check yours in Device Manager → Ports (COM & LPT), or with: pio device list
upload_port = COM10
monitor_port = COM10
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

build_flags =
  -DCORE_DEBUG_LEVEL=1
  ; Fan output level when NVS has no value yet: 1 = relay module (active-LOW),
  ; 0 = logic-level MOSFET (active-HIGH). Changeable later without reflashing
  ; (Wi-Fi portal or serial command "active-low 0|1").
  -DFAN_ACTIVE_LOW_DEFAULT=1

lib_deps =
  adafruit/DHT sensor library@1.4.7
  adafruit/Adafruit Unified Sensor@1.1.15
  claws/BH1750@1.3.0
  knolleary/PubSubClient@2.8
  bblanchon/ArduinoJson@7.4.3
  tzapu/WiFiManager@2.0.17

; ---------- Bring-up tests: same board, pins and libraries; one sketch each ----------
[env:test_dht]
extends = env:esp32dev
build_src_filter = -<*> +<bringup/test_dht.cpp>

[env:test_soil]
extends = env:esp32dev
build_src_filter = -<*> +<bringup/test_soil.cpp>

[env:test_bh1750]
extends = env:esp32dev
build_src_filter = -<*> +<bringup/test_bh1750.cpp>

[env:test_fan]
extends = env:esp32dev
build_src_filter = -<*> +<bringup/test_fan.cpp>
