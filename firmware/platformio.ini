; OPTIONAL. The firmware is an Arduino IDE sketch (SmartGreenhouse/), see
; docs/firmware.md. This file only lets PlatformIO build the same sketch folder.
; The bring-up tests (bringup/) are Arduino IDE sketches only.
; NOT VERIFIED: the sketch was compiled with Arduino IDE's esp32 core 4.0.0.
; PlatformIO's official platform below ships an older core (2.0.x); it was not
; compiled with it. secrets.h is needed here too (copy secrets.example.h).
; Build:  pio run            Flash:  pio run -t upload        Serial:  pio device monitor

[platformio]
src_dir = SmartGreenhouse
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino

; This laptop also has several Bluetooth serial ports (COM3–COM8); pin the
; ESP32's CP2102 port so upload/monitor never pick the wrong one.
upload_port = COM10
monitor_port = COM10
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

; Arduino IDE equivalent: Tools → Core Debug Level → "Error".
build_flags =
  -DCORE_DEBUG_LEVEL=1

lib_deps =
  adafruit/DHT sensor library@1.4.7
  adafruit/Adafruit Unified Sensor@1.1.15
  claws/BH1750@1.3.0
  bblanchon/ArduinoJson@7.4.3
  knolleary/PubSubClient@2.8
